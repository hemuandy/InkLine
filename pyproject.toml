[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkline"
version = "1.0.0"
description = "墨线 InkLine — 把照片变成手绘线稿的桌面工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hemuandy" }]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "PySide6>=6.6",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/hemuandy/InkLine"

[project.scripts]
inkline = "inkline.app:main"

[tool.setuptools]
packages = ["inkline", "inkline.core", "inkline.ui"]

[tool.setuptools.package-data]
inkline = ["assets/*"]
